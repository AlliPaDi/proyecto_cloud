<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topología SDN - OVS Bridges</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #060a12;
            --fg: #e2e8f0;
            --muted: #475569;
            --accent: #0ea5e9;
            --card: #0b1120;
            --border: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #topology-canvas { display: block; cursor: default; }
        .tooltip-box {
            position: fixed;
            background: rgba(11, 17, 32, 0.96);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.18s;
            backdrop-filter: blur(12px);
            z-index: 200;
            max-width: 280px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .tooltip-box.visible { opacity: 1; }
        .btn-ctrl {
            padding: 8px 16px; font-size: 13px; border-radius: 8px;
            background: #111827; border: 1px solid #1e293b;
            color: #cbd5e1; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 7px;
        }
        .btn-ctrl:hover { background: #1e293b; border-color: #334155; }
        .btn-ctrl.active { border-color: #0ea5e9; color: #38bdf8; background: #0c1929; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeInUp 0.5s ease-out both; }
    </style>
</head>
<body>

<!-- Contenido principal -->
<main class="max-w-[1400px] mx-auto px-4 py-4 fade-in">
    <div class="rounded-xl border border-slate-800/50 bg-[#080d18] overflow-hidden shadow-2xl shadow-black/40">
        <canvas id="topology-canvas"></canvas>
    </div>
</main>

<!-- Tooltip flotante -->
<div id="tooltip" class="tooltip-box"></div>

<script>
/* =========================================================
   CONFIGURACION Y DATOS
   ========================================================= */
const BASE_W = 1200, BASE_H = 1200;

const VLAN_COLORS = {
    0:   '#22c55e', 100: '#06b6d4', 200: '#f59e0b',
    300: '#8b5cf6', 400: '#ec4899', 500: '#ef4444',
    vlanslice: '#f43f5e', ofs: '#94a3b8'
};

const VLAN_GLOWS = {
    0:   'rgba(34,197,94,0.35)', 100: 'rgba(6,182,212,0.35)', 200: 'rgba(245,158,11,0.35)',
    300: 'rgba(139,92,246,0.35)', 400: 'rgba(236,72,153,0.35)', 500: 'rgba(239,68,68,0.35)',
    vlanslice: 'rgba(244,63,94,0.35)', ofs: 'rgba(148,163,184,0.2)'
};

const NODE_STYLE = {
    ofs:    { bg: '#1c1508', border: '#f59e0b', text: '#fbbf24', glow: 'rgba(245,158,11,0.25)', icon: '\uf6ff' },
    worker: { bg: '#081c1a', border: '#14b8a6', text: '#2dd4bf', glow: 'rgba(20,184,166,0.25)', icon: '\uf0e8' },
    slice:  { bg: '#081a1e', border: '#06b6d4', text: '#22d3ee', glow: 'rgba(6,182,212,0.25)', icon: '\uf0e8' },
    vm:     { bg: '#12081e', border: '#8b5cf6', text: '#a78bfa', glow: 'rgba(139,92,246,0.25)', icon: '\uf108' }
};

/* Nodos: Topologia 1 (Superior) y Topologia 2 (Inferior) */
const nodes = {
    // --- TOPOLOGIA 1 ---
    ofs:      { cx: 600, cy: 80,  w: 140, h: 44, label: 'OFS',      type: 'ofs', desc: 'OpenFlow Switch Central' },
    brW1:     { cx: 190, cy: 220, w: 120, h: 38, label: 'Br-W1',    type: 'worker', server: 1, desc: 'Bridge Worker (S1)' },
    brSlice1: { cx: 190, cy: 340, w: 120, h: 38, label: 'Br-Slice', type: 'slice', server: 1, desc: 'Bridge Slice (S1)' },
    vm1:      { cx: 128, cy: 460, w: 84,  h: 34, label: 'VM1',      type: 'vm', server: 1, desc: 'VM1 (S1) - VLANs: 0, 200' },
    vm4:      { cx: 252, cy: 460, w: 84,  h: 34, label: 'VM4',      type: 'vm', server: 1, desc: 'VM4 (S1) - VLANs: 0, 100, 400' },
    
    brW2:     { cx: 600, cy: 220, w: 120, h: 38, label: 'Br-W2',    type: 'worker', server: 2, desc: 'Bridge Worker (S2)' },
    brSlice2: { cx: 600, cy: 340, w: 120, h: 38, label: 'Br-Slice', type: 'slice', server: 2, desc: 'Bridge Slice (S2)' },
    vm2:      { cx: 538, cy: 460, w: 84,  h: 34, label: 'VM2',      type: 'vm', server: 2, desc: 'VM2 (S2) - VLANs: 200, 300' },
    vm5:      { cx: 662, cy: 460, w: 84,  h: 34, label: 'VM5',      type: 'vm', server: 2, desc: 'VM5 (S2) - VLANs: 400, 500' },
    
    brW3:     { cx: 1010, cy: 220, w: 120, h: 38, label: 'Br-W3',   type: 'worker', server: 3, desc: 'Bridge Worker (S3)' },
    brSlice3: { cx: 1010, cy: 340, w: 120, h: 38, label: 'Br-Slice',type: 'slice', server: 3, desc: 'Bridge Slice (S3)' },
    vm3:      { cx: 948, cy: 460, w: 84,  h: 34, label: 'VM3',      type: 'vm', server: 3, desc: 'VM3 (S3) - VLANs: 100, 300' },
    vm6:      { cx: 1072, cy: 460, w: 84,  h: 34, label: 'VM6',     type: 'vm', server: 3, desc: 'VM6 (S3) - VLANs: 500' },

    // --- TOPOLOGIA 2 (Conectividad Logica VMs) ---
    t2_vm1: { cx: 300, cy: 840, w: 100, h: 40, label: 'VM1', type: 'vm', desc: 'Conectada a VM2 (V200), VM4 (V0)' },
    t2_vm2: { cx: 900, cy: 840, w: 100, h: 40, label: 'VM2', type: 'vm', desc: 'Conectada a VM1 (V200), VM3 (V300)' },
    t2_vm3: { cx: 900, cy: 1040, w: 100, h: 40, label: 'VM3', type: 'vm', desc: 'Conectada a VM2 (V300), VM4 (V100)' },
    t2_vm4: { cx: 300, cy: 1040, w: 100, h: 40, label: 'VM4', type: 'vm', desc: 'Conectada a VM1 (V0), VM3 (V100), VM5 (V400)' },
    t2_vm5: { cx: 500, cy: 1150, w: 100, h: 40, label: 'VM5', type: 'vm', desc: 'Conectada a VM4 (V400), VM6 (V500)' },
    t2_vm6: { cx: 700, cy: 1150, w: 100, h: 40, label: 'VM6', type: 'vm', desc: 'Conectada a VM5 (V500)' }
};

const servers = [
    { x: 48, y: 160, w: 284, h: 350, label: 'Worker 1' },
    { x: 458, y: 160, w: 284, h: 350, label: 'Worker 2' },
    { x: 868, y: 160, w: 284, h: 350, label: 'Worker 3' },
];

const links = [
    // --- TOPOLOGIA 1 ---
    { from: 'ofs', to: 'brW1', type: 'ofs', offset: 0, srcPort: 'eth0', dstPort: 'eth0' },
    { from: 'ofs', to: 'brW2', type: 'ofs', offset: 0, srcPort: 'eth1', dstPort: 'eth0' },
    { from: 'ofs', to: 'brW3', type: 'ofs', offset: 0, srcPort: 'eth2', dstPort: 'eth0' },
    { from: 'brW1', to: 'brSlice1', type: 'vlanslice', offset: 0, srcPort: 'veth0', dstPort: 'veth0' },
    { from: 'brW2', to: 'brSlice2', type: 'vlanslice', offset: 0, srcPort: 'veth0', dstPort: 'veth0' },
    { from: 'brW3', to: 'brSlice3', type: 'vlanslice', offset: 0, srcPort: 'veth0', dstPort: 'veth0' },
    
    { from: 'brSlice1', to: 'vm1', vlan: 200, offset: -5, srcPort: 'vnet0', dstPort: 'eth0' },
    { from: 'vm1', to: 'vm4', vlan: 0, offset: 0, srcPort: 'eth1', dstPort: 'eth1' },
    { from: 'brSlice1', to: 'vm4', vlan: 100, offset: -5, srcPort: 'vnet1', dstPort: 'eth2' },
    { from: 'brSlice1', to: 'vm4', vlan: 400, offset: 5,  srcPort: 'vnet2', dstPort: 'eth3' },
    
    { from: 'brSlice2', to: 'vm2', vlan: 200, offset: -5, srcPort: 'vnet0', dstPort: 'eth0' },
    { from: 'brSlice2', to: 'vm2', vlan: 300, offset: 5,  srcPort: 'vnet1', dstPort: 'eth1' },
    { from: 'brSlice2', to: 'vm5', vlan: 400, offset: -5, srcPort: 'vnet2', dstPort: 'eth0' },
    { from: 'brSlice2', to: 'vm5', vlan: 500, offset: 5,  srcPort: 'vnet3', dstPort: 'eth1' },
    
    { from: 'brSlice3', to: 'vm3', vlan: 100, offset: -5, srcPort: 'vnet0', dstPort: 'eth0' },
    { from: 'brSlice3', to: 'vm3', vlan: 300, offset: 5,  srcPort: 'vnet1', dstPort: 'eth1' },
    { from: 'brSlice3', to: 'vm6', vlan: 500, offset: 0,  srcPort: 'vnet2', dstPort: 'eth0' },

    // --- TOPOLOGIA 2 (Conexiones Logicas Directas) ---
    { from: 't2_vm1', to: 't2_vm2', vlan: 200, offset: 0, srcPort: 'V200', dstPort: 'V200' },
    { from: 't2_vm2', to: 't2_vm3', vlan: 300, offset: 0, srcPort: 'V300', dstPort: 'V300' },
    { from: 't2_vm3', to: 't2_vm4', vlan: 100, offset: 0, srcPort: 'V100', dstPort: 'V100' },
    { from: 't2_vm4', to: 't2_vm1', vlan: 0, offset: 0, srcPort: 'V0', dstPort: 'V0' },
    { from: 't2_vm4', to: 't2_vm5', vlan: 400, offset: 0, srcPort: 'V400', dstPort: 'V400' },
    { from: 't2_vm5', to: 't2_vm6', vlan: 500, offset: 0, srcPort: 'V500', dstPort: 'V500' }
];

/* =========================================================
   CANVAS SETUP
   ========================================================= */
const canvas = document.getElementById('topology-canvas');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, sc;

function sx(v) { return v * sc; }
function sy(v) { return v * sc; }
function ss(v) { return Math.max(0.5, v * sc); }

function setupCanvas() {
    const container = canvas.parentElement;
    W = container.clientWidth;
    sc = W / BASE_W;
    H = Math.round(BASE_H * sc);
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
let animating = true;
let hoveredNode = null;
let hoveredLink = null;
let time = 0;
const particles = [];

/* =========================================================
   PARTICULAS DE FLUJO
   ========================================================= */
function spawnParticles() {
    if (!animating) return;
    links.forEach((link, i) => {
        if (Math.random() < 0.015) {
            let color = VLAN_COLORS[link.type || link.vlan];
            if (!color) return;
            particles.push({
                li: i, t: 0,
                speed: 0.004 + Math.random() * 0.004,
                color: color,
                size: 2.5 + Math.random() * 1,
                dir: Math.random() > 0.5 ? 1 : -1
            });
        }
    });
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].t += particles[i].speed;
        if (particles[i].t >= 1) particles.splice(i, 1);
    }
    if (particles.length > 300) particles.splice(0, particles.length - 300);
}

/* =========================================================
   FUNCIONES AUXILIARES DE DIBUJO
   ========================================================= */
function roundedRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function getLinkEndpoints(link) {
    const a = nodes[link.from], b = nodes[link.to];
    let x1, y1, x2, y2;

    if (a.type === 'vm' && b.type === 'vm') {
        const dx = b.cx - a.cx, dy = b.cy - a.cy;
        if (Math.abs(dx) > Math.abs(dy)) {
            x1 = dx > 0 ? a.cx + a.w / 2 : a.cx - a.w / 2; y1 = a.cy;
            x2 = dx > 0 ? b.cx - b.w / 2 : b.cx + b.w / 2; y2 = b.cy;
        } else {
            x1 = a.cx; y1 = dy > 0 ? a.cy + a.h / 2 : a.cy - a.h / 2;
            x2 = b.cx; y2 = dy > 0 ? b.cy - b.h / 2 : b.cy + b.h / 2;
        }
    } else {
        x1 = a.cx; y1 = a.cy + a.h / 2;
        x2 = b.cx; y2 = b.cy - b.h / 2;
    }

    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    const nx = -dy / len, ny = dx / len;
    const off = link.offset || 0;
    return { x1: x1 + nx * off, y1: y1 + ny * off, x2: x2 + nx * off, y2: y2 + ny * off };
}

/* =========================================================
   DIBUJO: FONDO Y SEPARADORES
   ========================================================= */
function drawBackground() {
    const grad = ctx.createRadialGradient(sx(600), sy(400), 0, sx(600), sy(600), sx(800));
    grad.addColorStop(0, '#0d1525');
    grad.addColorStop(1, '#060a12');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(100,116,139,0.06)';
    for (let gx = 0; gx < BASE_W; gx += 30) {
        for (let gy = 0; gy < BASE_H; gy += 30) {
            ctx.beginPath(); ctx.arc(sx(gx), sy(gy), ss(0.6), 0, Math.PI * 2); ctx.fill();
        }
    }

    // Linea divisora y titulos
    ctx.strokeStyle = 'rgba(30,41,59,0.6)';
    ctx.lineWidth = ss(1);
    ctx.setLineDash([ss(8), ss(6)]);
    ctx.beginPath(); ctx.moveTo(0, sy(680)); ctx.lineTo(W, sy(680)); ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = '700 ' + ss(18) + 'px "Space Grotesk", sans-serif';
    ctx.fillStyle = 'rgba(226,232,240,0.15)';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('EN INFRAESTRUCTURA', sx(40), sy(30));
    
    ctx.fillStyle = 'rgba(139,92,246,0.2)';
    ctx.fillText('CONECTIVIDAD LOGICA VMs (DOMINIOS VLAN)', sx(40), sy(710));
}

/* =========================================================
   DIBUJO: CAJAS DE SERVIDOR
   ========================================================= */
function drawServers() {
    servers.forEach(s => {
        const x = sx(s.x), y = sy(s.y), w = sx(s.w), h = sy(s.h), r = ss(12);
        ctx.save(); ctx.fillStyle = 'rgba(8,15,28,0.55)'; ctx.strokeStyle = 'rgba(14,165,233,0.12)';
        ctx.lineWidth = ss(1); ctx.setLineDash([ss(6), ss(4)]);
        roundedRect(x, y, w, h, r); ctx.fill(); ctx.stroke(); ctx.setLineDash([]); ctx.restore();

        ctx.font = '600 ' + ss(12) + 'px "Space Grotesk", sans-serif';
        ctx.fillStyle = 'rgba(14,165,233,0.35)'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(s.label, x + ss(14), y + ss(10));
    });
}

/* =========================================================
   DIBUJO: ENLACES
   ========================================================= */
function drawLinks() {
    links.forEach((link, i) => {
        const { x1, y1, x2, y2 } = getLinkEndpoints(link);
        const isHovered = hoveredLink === i;
        let color = VLAN_COLORS[link.type || link.vlan];
        let glow = VLAN_GLOWS[link.type || link.vlan];
        if (!color) return;

        let lineW = isHovered ? 3 : 2;
        let labelText = link.type === 'ofs' ? null : (link.type === 'vlanslice' ? 'VlanSlice' : (link.vlan === 0 ? 'V0' : 'V' + link.vlan));

        ctx.save();
        if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = ss(isHovered ? 14 : 6); }
        ctx.beginPath(); ctx.moveTo(sx(x1), sy(y1)); ctx.lineTo(sx(x2), sy(y2));
        ctx.setLineDash([]); ctx.strokeStyle = color; ctx.lineWidth = ss(lineW); ctx.stroke();
        ctx.shadowBlur = 0;

        if (labelText && (x2 - x1) !== 0) {
            const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.sqrt(dx*dx + dy*dy);
            const nnx = -dy / len, nny = dx / len;
            const lOff = 12;

            ctx.font = '600 ' + ss(9) + 'px "JetBrains Mono", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const tw = ctx.measureText(labelText).width + ss(10);
            const th = ss(14);
            const lx = sx(mx + nnx * lOff), ly = sy(my + nny * lOff);
            
            ctx.fillStyle = 'rgba(6,10,18,0.9)'; roundedRect(lx - tw / 2, ly - th / 2, tw, th, ss(3)); ctx.fill();
            ctx.strokeStyle = color; ctx.lineWidth = ss(0.6); roundedRect(lx - tw / 2, ly - th / 2, tw, th, ss(3)); ctx.stroke();
            ctx.fillStyle = color; ctx.fillText(labelText, lx, ly);
        }
        ctx.restore();
    });
}

/* =========================================================
   DIBUJO: PARTICULAS
   ========================================================= */
function drawParticles() {
    particles.forEach(p => {
        const link = links[p.li];
        const { x1, y1, x2, y2 } = getLinkEndpoints(link);
        const t = p.dir === 1 ? p.t : 1 - p.t;
        const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;

        ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = ss(5);
        ctx.beginPath(); ctx.arc(sx(px), sy(py), ss(p.size), 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill(); ctx.restore();
    });
}

/* =========================================================
   DIBUJO: NODOS
   ========================================================= */
function drawNodes() {
    Object.entries(nodes).forEach(([key, node]) => {
        const st = NODE_STYLE[node.type];
        const isHovered = hoveredNode === key;
        const x = sx(node.cx - node.w / 2), y = sy(node.cy - node.h / 2);
        const w = sx(node.w), h = sx(node.h), r = ss(8);

        ctx.save(); ctx.shadowColor = st.glow; ctx.shadowBlur = ss(isHovered ? 20 : 8);
        ctx.fillStyle = isHovered ? st.border + '22' : st.bg;
        ctx.strokeStyle = isHovered ? st.border : st.border + '99';
        ctx.lineWidth = ss(isHovered ? 2 : 1.2);
        roundedRect(x, y, w, h, r); ctx.fill(); ctx.stroke(); ctx.restore();

        if (node.type === 'vm') {
            ctx.save(); ctx.font = '900 ' + ss(10) + 'px "Font Awesome 6 Free"';
            ctx.fillStyle = st.text + '55'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            ctx.fillText(st.icon, x + w - ss(8), sy(node.cy)); ctx.restore();
        }

        ctx.save();
        const fontSize = node.type === 'ofs' ? 14 : (node.type === 'vm' ? 12 : 11);
        ctx.font = (node.type === 'ofs' ? '700 ' : '500 ') + ss(fontSize) + 'px "JetBrains Mono", monospace';
        ctx.fillStyle = isHovered ? st.text : st.text + 'cc';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(node.label, sx(node.cx - (node.type === 'vm' ? 4 : 0)), sy(node.cy));
        ctx.restore();
    });
}

/* =========================================================
   INTERACCION: MOUSE
   ========================================================= */
let mouseX = 0, mouseY = 0;

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;

    let found = null;
    Object.entries(nodes).forEach(([key, node]) => {
        const nx = sx(node.cx - node.w / 2), ny = sy(node.cy - node.h / 2);
        if (mouseX >= nx && mouseX <= nx + sx(node.w) && mouseY >= ny && mouseY <= ny + sx(node.h)) found = key;
    });

    let foundLink = null;
    if (!found) {
        links.forEach((link, i) => {
            const { x1, y1, x2, y2 } = getLinkEndpoints(link);
            const dist = ptSegDist(mouseX, mouseY, sx(x1), sy(y1), sx(x2), sy(y2));
            if (dist < 8) foundLink = i;
        });
    }

    hoveredNode = found; hoveredLink = foundLink;
    canvas.style.cursor = (found || foundLink !== null) ? 'pointer' : 'default';

    const tooltip = document.getElementById('tooltip');
    if (found) {
        const node = nodes[found]; const st = NODE_STYLE[node.type];
        tooltip.innerHTML = '<div style="color:' + st.text + ';font-weight:600;font-size:13px;margin-bottom:4px;">' + node.label + '</div>' +
            '<div style="color:#94a3b8;font-size:11px;">' + node.desc + '</div>' +
            (node.server ? '<div style="color:#475569;font-size:10px;margin-top:4px;">Servidor ' + node.server + '</div>' : '');
        tooltip.classList.add('visible');
        tooltip.style.left = (e.clientX + 16) + 'px'; tooltip.style.top = (e.clientY - 10) + 'px';
    } else if (foundLink !== null) {
        const link = links[foundLink];
        let typeLabel = '', color = '#94a3b8';
        if (link.type === 'ofs') { typeLabel = 'Conexion OFS'; color = VLAN_COLORS.ofs; }
        else if (link.type === 'vlanslice') { typeLabel = 'VlanSlice'; color = VLAN_COLORS.vlanslice; }
        else if (link.vlan === 0) { typeLabel = 'VLAN 0 (Default)'; color = VLAN_COLORS[0]; }
        else if (link.vlan) { typeLabel = 'VLAN ' + link.vlan; color = VLAN_COLORS[link.vlan]; }
        
        tooltip.innerHTML = '<div style="color:' + color + ';font-weight:600;font-size:12px;margin-bottom:4px;">' + typeLabel + '</div>' +
            '<div style="color:#94a3b8;font-size:11px;">' + nodes[link.from].label + ' -> ' + nodes[link.to].label + '</div>';
        tooltip.classList.add('visible');
        tooltip.style.left = (e.clientX + 16) + 'px'; tooltip.style.top = (e.clientY - 10) + 'px';
    } else {
        tooltip.classList.remove('visible');
    }
});

canvas.addEventListener('mouseleave', () => {
    hoveredNode = null; hoveredLink = null;
    document.getElementById('tooltip').classList.remove('visible');
});

function ptSegDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.sqrt((px - x1) ** 2 + (py - y1) ** 2);
    let t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lenSq));
    return Math.sqrt((px - (x1 + t * dx)) ** 2 + (py - (y1 + t * dy)) ** 2);
}

function toggleAnim() {
    animating = !animating;
    document.getElementById('btn-anim').classList.toggle('active', animating);
}

/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */
function render() {
    time += 0.016;
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawServers();
    drawLinks();

    spawnParticles(); updateParticles(); drawParticles();

    drawNodes();

    requestAnimationFrame(render);
}

function init() { setupCanvas(); render(); }
window.addEventListener('resize', setupCanvas);
document.fonts.ready.then(init);
</script>
